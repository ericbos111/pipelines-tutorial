apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: advanced-pr-validation
spec:
  pipelineRef:
    name: advanced-build-and-deploy
  params:
  # Git parameters
  - name: git-url
    value: https://github.com/openshift/pipelines-vote-api.git
  - name: git-revision
    value: main  # In real scenario, this would be the PR branch
  
  # Build parameters
  - name: deployment-name
    value: pipelines-vote-api-pr
  - name: IMAGE
    value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/pipelines-vote-api-pr
  
  # Quality and security parameters - ALL CHECKS ENABLED
  - name: language
    value: nodejs
  - name: enable-security-scan
    value: "true"  # Run security scan for PRs
  - name: run-tests
    value: "true"  # Run all tests
  - name: test-coverage-threshold
    value: "80"  # Enforce coverage threshold
  
  # Deployment parameters - NO DEPLOYMENT FOR PRs
  - name: deploy-to-production
    value: "false"  # Don't deploy for PR validation
  - name: environment
    value: dev
  - name: require-approval
    value: "false"
  
  # Notification parameters
  - name: notification-webhook
    value: ""  # Could be set to GitHub webhook for PR status updates
  
  workspaces:
  - name: shared-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
  - name: test-results-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi

