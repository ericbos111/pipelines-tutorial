apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: advanced-build-deploy-production
spec:
  pipelineRef:
    name: advanced-build-and-deploy
  params:
  # Git parameters
  - name: git-url
    value: https://github.com/openshift/pipelines-vote-api.git
  - name: git-revision
    value: main
  
  # Build parameters
  - name: deployment-name
    value: pipelines-vote-api
  - name: image
    value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/pipelines-vote-api
  
  # Quality and security parameters
  - name: language
    value: nodejs
  - name: enable-security-scan
    value: "true"
  - name: run-tests
    value: "true"
  - name: test-coverage-threshold
    value: "80"
  
  # Deployment parameters - PRODUCTION DEPLOYMENT
  - name: deploy-to-production
    value: "true"
  - name: environment
    value: production
  - name: require-approval
    value: "true"
  
  # Notification parameters
  - name: notification-webhook
    value: ""
  
  workspaces:
  - name: shared-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  - name: cache-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
  - name: test-results-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi

