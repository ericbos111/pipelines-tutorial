apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: security-scan
spec:
  description: >-
    This task performs security vulnerability scanning on the source code and dependencies.
    It checks for known vulnerabilities and security issues.
    
    NOTE: This task simulates security scanning for demonstration purposes. In production,
    integrate with actual security tools like Trivy, Snyk, or Aqua.
  workspaces:
  - name: source
    description: The workspace containing the source code to scan
  params:
  - name: scan-type
    description: Type of security scan (dependencies, code, container)
    type: string
    default: "dependencies"
  - name: severity-threshold
    description: Minimum severity level to report (low, medium, high, critical)
    type: string
    default: "high"
  - name: fail-on-critical
    description: Whether to fail the task if critical vulnerabilities are found
    type: string
    default: "true"
  results:
  - name: vulnerabilities-found
    description: Number of vulnerabilities found
  - name: critical-count
    description: Number of critical vulnerabilities
  - name: scan-status
    description: Overall scan status (passed/failed)
  steps:
  - name: scan-dependencies
    image: aquasec/trivy:latest
    workingDir: $(workspaces.source.path)
    script: |
      #!/bin/sh
      set -e
      
      echo "=========================================="
      echo "Running Security Scan"
      echo "Scan Type: $(params.scan-type)"
      echo "Severity Threshold: $(params.severity-threshold)"
      echo "=========================================="
      
      # Simulate security scanning
      TOTAL_VULNS=0
      CRITICAL_VULNS=0
      
      case "$(params.scan-type)" in
        dependencies)
          echo "Scanning dependencies for vulnerabilities..."
          if [ -f "package.json" ] || [ -f "requirements.txt" ] || [ -f "pom.xml" ]; then
            echo "✓ Dependency manifest found"
            echo "Checking for known vulnerabilities..."
            echo ""
            echo "Found vulnerabilities:"
            echo "  - lodash@4.17.15 (Medium): Prototype Pollution"
            echo "  - axios@0.19.0 (Low): Information Disclosure"
            TOTAL_VULNS=2
            CRITICAL_VULNS=0
          else
            echo "⚠ No dependency manifest found, skipping scan"
          fi
          ;;
        code)
          echo "Scanning source code for security issues..."
          echo "✓ No hardcoded secrets found"
          echo "✓ No SQL injection vulnerabilities detected"
          echo "✓ No XSS vulnerabilities detected"
          TOTAL_VULNS=0
          CRITICAL_VULNS=0
          ;;
        container)
          echo "Scanning container image for vulnerabilities..."
          echo "⚠ Base image has 5 medium severity vulnerabilities"
          TOTAL_VULNS=5
          CRITICAL_VULNS=0
          ;;
        *)
          echo "Unknown scan type: $(params.scan-type)"
          TOTAL_VULNS=0
          CRITICAL_VULNS=0
          ;;
      esac
      
      echo ""
      echo "=========================================="
      echo "Security Scan Results:"
      echo "  Total Vulnerabilities: $TOTAL_VULNS"
      echo "  Critical: $CRITICAL_VULNS"
      echo "  Threshold: $(params.severity-threshold)"
      echo "=========================================="
      
      # Determine scan status
      if [ $CRITICAL_VULNS -gt 0 ] && [ "$(params.fail-on-critical)" = "true" ]; then
        SCAN_STATUS="failed"
        echo "✗ FAILED: Critical vulnerabilities found"
      else
        SCAN_STATUS="passed"
        echo "✓ PASSED: No critical vulnerabilities or fail-on-critical disabled"
      fi
      
      # Write results
      echo -n "$TOTAL_VULNS" > $(results.vulnerabilities-found.path)
      echo -n "$CRITICAL_VULNS" > $(results.critical-count.path)
      echo -n "$SCAN_STATUS" > $(results.scan-status.path)
      
      # Fail if critical vulnerabilities found and fail-on-critical is true
      if [ "$SCAN_STATUS" = "failed" ]; then
        exit 1
      fi
      
      echo "✓ Security scan completed successfully"

# Made with Bob
